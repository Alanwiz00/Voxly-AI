server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export emits a real .html file for every route (trailingSlash: true
    # → /api-docs/ → /api-docs/index.html). Anything that doesn't resolve to a
    # file is a genuine 404: serve Next's exported 404.html WITH a 404 status.
    # The previous `/index.html` fallback returned 200 for every path on earth
    # (/.env, /wp-login.php, /.git/config, *.js.map, /sitemap.xml ...), which
    # makes every vulnerability scanner treat the site as one big soft-404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Immutable, content-hashed build assets — cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt  { access_log off; }
    location = /favicon.svg { access_log off; expires 7d; }

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
